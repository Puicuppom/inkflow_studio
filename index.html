<style>
:root{--bg:#f6faff;--panel:#fff;--line:#e2ebf5;--ink:#1b2a3d;--muted:#64748b;--brand:#ec4f8f;--brandD:#d93a7c;--brand2:#fdebf3;--sky:#2b9fe6;--skyD:#1a86cc;--sky2:#e8f4fd;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--stage:#eaf2fb;--r:12px;--sh:0 1px 2px rgba(27,42,61,.05),0 4px 16px rgba(43,159,230,.07)}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Kanit,Prompt,system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-tap-highlight-color:transparent;font-weight:400;letter-spacing:.1px}
button{font:inherit;cursor:pointer;color:inherit}input,select,textarea{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn{transition:.15s}.btn:hover{border-color:var(--sky);color:var(--skyD)}.btn.pri{background:linear-gradient(135deg,#f472a8,var(--brand));border-color:transparent;color:#fff;font-weight:500;box-shadow:0 4px 14px rgba(236,79,143,.28)}.btn.pri:hover{color:#fff;filter:brightness(1.05);box-shadow:0 6px 18px rgba(236,79,143,.36)}.btn.sm{padding:5px 10px;font-size:13px}.btn:disabled{opacity:.45;cursor:default}
.btn.danger{color:var(--bad)}
input[type=text],input[type=number],select,textarea{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:#fff;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--sky);box-shadow:0 0 0 3px rgba(43,159,230,.14)}
.muted{color:var(--muted)}.small{font-size:13px}.row{display:flex;gap:8px;align-items:center}.grow{flex:1}
/* ---------- top */
#top{height:60px;display:flex;align-items:center;gap:12px;padding:0 20px;background:var(--panel);border-bottom:1px solid var(--line);position:relative;z-index:5;box-shadow:0 1px 0 rgba(0,0,0,.02)}#top:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:linear-gradient(90deg,var(--sky),#9ad1f7 45%,#f7a8c9 60%,var(--brand))}
#top .logo{font-weight:700;font-size:19px;background:linear-gradient(90deg,var(--sky),var(--brand));-webkit-background-clip:text;background-clip:text;color:transparent;display:flex;align-items:center;gap:8px}#top .mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--sky),var(--brand));display:grid;place-items:center;flex:none;box-shadow:0 4px 12px rgba(43,159,230,.3);overflow:hidden}#top .mark svg{width:34px;height:34px;display:block}
#top .tn{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* ---------- home */
#home{max-width:1120px;margin:0 auto;padding:26px 20px 60px}
.hero{border-radius:22px;padding:34px 36px;margin-bottom:26px;background:radial-gradient(120% 140% at 0% 0%,#d9eeff 0,#eef7ff 40%,#fff 62%,#ffeaf3 100%);border:1px solid var(--line);position:relative;overflow:hidden}
.hero h1{font-size:32px;margin:0 0 6px;font-weight:700;color:var(--ink)}.hero h1 em{font-style:normal;background:linear-gradient(90deg,var(--sky),var(--brand));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);margin:0 0 20px;font-size:16px}
.steps{display:flex;gap:12px;flex-wrap:wrap}.steps div{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.85);border:1px solid var(--line);border-radius:14px;padding:10px 16px;font-size:14.5px;box-shadow:var(--sh)}
.steps b{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:14px;background:var(--sky)}.steps div:nth-child(2) b{background:linear-gradient(135deg,var(--sky),var(--brand))}.steps div:nth-child(3) b{background:var(--brand)}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(236,79,143,.18),transparent 70%)}
.sech{font-size:18px;font-weight:600;margin:0 0 12px;display:flex;align-items:center;gap:8px}.sech:before{content:"";width:4px;height:18px;border-radius:2px;background:linear-gradient(var(--sky),var(--brand))}
.more{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:11px 2px;font:inherit;font-size:13px;font-weight:600;color:#5a7a99;cursor:pointer}.more i{font-style:normal;color:#9bb}.sec .more{border-top:0;padding:8px 2px}
.thead{display:flex;gap:12px;align-items:flex-start;margin:4px 0 14px}.thead h3{margin:2px 0 4px!important}.tdesc{margin:0 0 4px;color:#46607a;font-size:14px;line-height:1.5}.tmeta{margin:0;color:#8aa4bc;font-size:12px}.tdescIn{width:100%;margin-top:6px;box-sizing:border-box;font:inherit;font-size:12px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;resize:vertical}
.pgrid{display:flex;flex-wrap:wrap;gap:10px;padding:4px 0 8px}.pcard{width:128px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:5px;align-items:center}.pcard img{max-width:110px;max-height:150px;cursor:pointer;border-radius:4px;box-shadow:0 1px 6px rgba(0,0,0,.12)}.pcard b{font-size:13px}.pcard input{width:100%;box-sizing:border-box;font:inherit;font-size:11px;padding:4px 6px;border:1px solid var(--line);border-radius:6px}.pacts{display:flex;gap:3px;width:100%}.pacts button{flex:1;border:1px solid var(--line);background:#fff;border-radius:6px;font:inherit;font-size:11px;padding:3px 0;cursor:pointer;color:#2b9fe6}.pacts button.bad{color:#d33}
.psearch{display:flex;align-items:center;gap:10px;margin:0 0 10px}.psearch input{flex:1;max-width:360px;font:inherit;font-size:15px;padding:10px 14px;border:1px solid var(--line);border-radius:12px}.psearch span{color:#8aa4bc;font-size:13px}.ptags{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}.ptags button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer;color:#46607a}.ptags button.on{background:var(--sky,#5bc0f8);color:#fff;border-color:transparent}
.tgrp{grid-column:1/-1}.tgrp h3{margin:6px 2px 10px;font-size:17px;color:var(--ink,#1d3557)}.tgrp h3 span{font-size:12px;font-weight:500;color:#8aa4bc;margin-left:6px}.tgrp .tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}
.prow td{padding-top:0!important;border-top:0!important}.pchip{display:inline-flex;align-items:center;gap:4px;background:var(--sky2,#e8f4fd);border-radius:999px;padding:3px 4px 3px 10px;margin:2px 4px 2px 0;font-size:12px}.pchip b{cursor:pointer;color:#2b9fe6}.pchip button.cp{color:#2b9fe6;font-size:13px}.pchip button{border:0;background:none;color:#c05;cursor:pointer;font-size:11px}
.tgal{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}
.tcard{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer;transition:transform .18s,box-shadow .18s,border-color .18s;text-align:left;padding:0;box-shadow:var(--sh)}

.combos button b{font-size:22px;font-weight:700;line-height:1}.combos button:hover{border-color:var(--sky);box-shadow:var(--sh)}.combos button.on{border-color:var(--sky);box-shadow:0 0 0 2px var(--sky)}

<script>
const SRC="<!DOCTYPE html>\n"+document.documentElement.outerHTML;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

        if(L.sect===1||L.sect===2){ const g=st.pop(); if(g&&g.r>g.l){ L.l=g.l; L.t=g.t; L.r=g.r; L.b=g.b; } L.group=true; }

// แบบเริ่มต้นจาก PSD: ตำแหน่งการ์ตูน (เลเยอร์ Cartoon) และข้อความ (เลเยอร์ text_name…)
// อ่านความใสของเลเยอร์ (ช่อง -1) เพื่อแยกการ์ตูนแต่ละตัว
function layerAlpha(P,L){ const i=L.cid.indexOf(-1); if(i<0) return null; let off=L.cs; for(let k=0;k<i;k++) off+=L.cl[k]; const W=L.r-L.l, H=L.b-L.t, v=new DataView(P.buf), u=new Uint8Array(P.buf), out=new Uint8Array(W*H);
  const cmp=v.getUint16(off); let p=off+2; if(cmp===0){ out.set(u.subarray(p,p+W*H)); return {W,H,a:out}; } if(cmp!==1) return null;
  const cnt=[]; for(let y=0;y<H;y++){ cnt.push(v.getUint16(p)); p+=2; }
  for(let y=0;y<H;y++){ let q=p, o=y*W; const end=p+cnt[y]; while(q<end&&o<(y+1)*W){ const n=u[q++]; if(n<128){ for(let k=0;k<=n;k++) out[o++]=u[q++]; } else if(n>128){ const c=u[q++]; for(let k=0;k<257-n;k++) out[o++]=c; } } p=end; }
  return {W,H,a:out}; }
function splitPieces(P,L){ const A=layerAlpha(P,L); if(!A) return null; const {W,H,a}=A, hz=W>=H, N=hz?W:H, M=hz?H:W, occ=new Uint8Array(N), lo=new Int32Array(N).fill(1e9), hi=new Int32Array(N).fill(-1);
  for(let y=0;y<H;y++) for(let x=0;x<W;x++) if(a[y*W+x]>24){ const i=hz?x:y, j=hz?y:x; occ[i]=1; if(j<lo[i]) lo[i]=j; if(j>hi[i]) hi[i]=j; }
  const runs=[], gap=Math.max(2,Math.round(N*.012)); let st=-1, last=-1;
  for(let i=0;i<N;i++){ if(occ[i]){ if(st<0) st=i; else if(i-last>gap){ runs.push([st,last]); st=i; } last=i; } } if(st>=0) runs.push([st,last]);
  const big=Math.max(...runs.map(r=>r[1]-r[0]),1), keep=runs.filter(r=>r[1]-r[0]>=big*.25);
  return keep.map(([s0,s1])=>{ let a0=1e9,a1=-1; for(let i=s0;i<=s1;i++){ if(occ[i]){ a0=Math.min(a0,lo[i]); a1=Math.max(a1,hi[i]); } }
    return hz?{x:L.l+s0,y:L.t+a0,w:s1-s0+1,h:a1-a0+1}:{x:L.l+a0,y:L.t+s0,w:a1-a0+1,h:s1-s0+1}; }); }
function psdLayout(P){ const vis=L=>L.sect===0&&!L.hidden&&L.r>L.l&&L.b>L.t, slots=[], texts=[], seen=new Set();
  P.layers.filter(L=>vis(L)&&/^cartoon/i.test(L.name)).forEach(L=>{ const x=Math.max(0,L.l), y=Math.max(0,L.t), w=Math.min(P.w,L.r)-x, h=Math.min(P.h,L.b)-y;

    for(let k=0;k<n;k++) slots.push(hz?{x:Math.round(x+k*w/n+gap/2),y,w:Math.round(w/n-gap),h}:{x,y:Math.round(y+k*h/n+gap/2),w,h:Math.round(h/n-gap)}); });
  P.layers.filter(L=>vis(L)&&/^text[_ ]?name/i.test(L.name)).forEach(L=>{ const k=[L.l,L.t,L.r,L.b].join(); if(seen.has(k)) return; seen.add(k);
    texts.push({x:L.l,y:L.t,w:L.r-L.l,h:L.b-L.t,link:L.name.toLowerCase().replace(/[^a-z0-9]/g,"")}); });
  return {slots,texts}; }
// กรอบ QR ต้นฉบับ: คัดลอกระเบียนเลเยอร์ qr_placeholder (ทั้งกลุ่ม) แบบไบต์ต่อไบต์ ไว้ใส่ในไฟล์ผลลัพธ์
function qrRecords(P){ const L=P.layers, u8=new Uint8Array(P.buf); let hi=-1;
  for(let i=0;i<L.length;i++) if(/qr/i.test(L[i].name)&&L[i].sect!==3){ hi=i; if(L[i].sect===1||L[i].sect===2) break; }
  if(hi<0) return null; let lo=hi;
  if(L[hi].sect===1||L[hi].sect===2){ let d=0; for(let j=hi-1;j>=0;j--){ if(L[j].sect===1||L[j].sect===2) d++; if(L[j].sect===3){ if(d===0){ lo=j; break; } d--; } } }
  const recs=[]; for(let j=lo;j<=hi;j++){ const R=L[j]; recs.push({rec:b64of(u8.subarray(R.rs,R.re)),ch:b64of(u8.subarray(R.cs,R.ce))}); }
  return recs; }
const b64of=u=>{ let s=""; for(let i=0;i<u.length;i+=32768) s+=String.fromCharCode.apply(null,u.subarray(i,i+32768)); return btoa(s); };
async function psdTemplate(file){ const r=await psdTemplate0(file); r.layoutPsd=JSON.parse(JSON.stringify(r.layout)); return r; }
async function psdTemplate0(file){
  const P=parsePsd(await readBuf(file));
  const q=P.layers.filter(L=>/qr/i.test(L.name)&&L.sect!==3).map(L=>L.vm?Object.assign({},L,L.vm):L).filter(L=>L.r>L.l&&L.b>L.t).sort((a,b)=>(b.r-b.l)*(b.b-b.t)-(a.r-a.l)*(a.b-a.t))[0];
  let th=null; if(P.thumb) th=await shrink(await readUrl(P.thumb.blob),360);
  return {id:"t"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),name:file.name.replace(/\.psd$/i,""),w:P.w,h:P.h,res:P.res,
    qr:q?{x:Math.max(0,q.l),y:Math.max(0,q.t),w:Math.min(P.w,q.r)-Math.max(0,q.l),h:Math.min(P.h,q.b)-Math.max(0,q.t)}:null,margin:1.5,thumb:th,mode:P.mode,layout:psdLayout(P),qrRec:qrRecords(P)}; 
}
async function shrink(url,max,type){ const im=await loadImg(url); if(!im) return url; const k=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight)); if(k>=1&&!type) return url;

  const face=(x,y,w,h)=>{ const r=Math.min(w,h)*.22, cx=x+w/2, cy=y+h/2; return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#ffd9a8" stroke="#e8a25a" stroke-width="${sw}"/><circle cx="${cx-r*.35}" cy="${cy-r*.1}" r="${r*.1}" fill="#6b4a2b"/><circle cx="${cx+r*.35}" cy="${cy-r*.1}" r="${r*.1}" fill="#6b4a2b"/><path d="M${cx-r*.35} ${cy+r*.3}q${r*.35} ${r*.3} ${r*.7} 0" fill="none" stroke="#6b4a2b" stroke-width="${sw}"/>`; };
  const txt=b=>`<rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="${Math.min(b.w,b.h)*.15}" fill="none" stroke="#ec4f8f" stroke-width="${m*.006}"/>`;
  return `<svg viewBox="0 0 ${t.w} ${t.h}" width="100%" height="100%" style="position:absolute;inset:0">
    ${L.slots.map(b=>`<rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="${Math.min(b.w,b.h)*.12}" fill="none" stroke="#2b9fe6" stroke-width="${m*.006}"/>`+face(b.x,b.y,b.w,b.h)).join("")}
    ${cells.map(txt).join("")}
    ${t.qr?`<rect x="${t.qr.x}" y="${t.qr.y}" width="${t.qr.w}" height="${t.qr.h}" rx="${m*.01}" fill="none" stroke="#2b9fe6" stroke-width="${m*.006}"/><g fill="#2b9fe6" opacity=".7">${(()=>{ const q=t.qr, s2=Math.min(q.h*.62,q.w*.62), x0=q.x+q.w/2-s2/2, y0=q.y+q.h/2-s2/2, u=s2/7; return [[0,0],[4,0],[0,4]].map(([a,b])=>`<rect x="${x0+a*u}" y="${y0+b*u}" width="${3*u}" height="${3*u}" fill="none" stroke="#2b9fe6" stroke-width="${u*.7}"/>`).join("")+`<rect x="${x0+4.5*u}" y="${y0+4.5*u}" width="${2*u}" height="${2*u}"/>`; })()}</g>`:""}
  </svg>`; }

// ---------- สี CMYK (เก็บเป็น % · แสดงบนจอด้วยโปรไฟล์ SWOP v2 เพื่อให้เห็นใกล้สีพิมพ์จริง)
let _RLUT=null; const RN=11;
function luts(){ if(!_LUT){ _LUT=b64u8($("lut").textContent); const ic=$("icc").textContent.trim(); if(ic) _ICC=b64u8(ic); _RLUT=b64u8($("rlut").textContent); } }
// โปรไฟล์สี SWOP (557 KB) ใช้แค่ตอนส่งออกไฟล์ → เว็บออนไลน์โหลดแยก (swop.icc) เฉพาะตอนดาวน์โหลด
async function needIcc(){ luts(); if(_ICC&&_ICC.length) return _ICC; const r=await fetch("swop.icc",{cache:"force-cache"}); if(!r.ok) throw new Error("โหลดโปรไฟล์สีไม่ได้"); _ICC=new Uint8Array(await r.arrayBuffer()); return _ICC; }
const u8b64=u=>{ let s=""; for(let i=0;i<u.length;i+=32768) s+=String.fromCharCode.apply(null,u.subarray(i,i+32768)); return btoa(s); };
const ICC_RE=/(<script type="text\/plain" id="icc">)[\s\S]*?(<\/script>)/;
function cmykOf(c){ if(Array.isArray(c)) return c; if(typeof c==="string"&&/^#?[0-9a-f]{6}$/i.test(c)){ luts(); const h=c.replace("#",""), o=[0,0,0,0]; rgb2cmyk(parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16),o); return o.map(v=>Math.round(v/2.55)); } return [0,0,0,100]; }
const _disp=new Map();
function cmyk2rgb(c,m,y,k,out){ luts(); const L=_RLUT, f=(RN-1)/255, v=[c*f,m*f,y*f,k*f], i0=v.map(x=>Math.min(RN-2,x|0)), d=v.map((x,j)=>x-i0[j]); out[0]=out[1]=out[2]=0;
  for(let q=0;q<16;q++){ let w=1, idx=0; for(let j=0;j<4;j++){ const b=(q>>j)&1; w*=b?d[j]:1-d[j]; idx=idx*RN+i0[j]+b; } if(!w) continue; idx*=3; out[0]+=L[idx]*w; out[1]+=L[idx+1]*w; out[2]+=L[idx+2]*w; } }
function disp(c){ c=cmykOf(c); const key=c.join(","); let r=_disp.get(key); if(r) return r; const o=[0,0,0]; cmyk2rgb(c[0]*2.55,c[1]*2.55,c[2]*2.55,c[3]*2.55,o); r=`rgb(${Math.round(o[0])},${Math.round(o[1])},${Math.round(o[2])})`; _disp.set(key,r); return r; }
const chanGray=(c,ch)=>{ const g=Math.round(255*(1-cmykOf(c)[ch]/100)); return `rgb(${g},${g},${g})`; };
const sameC=(a,b)=>{ a=cmykOf(a); b=cmykOf(b); return a.every((v,i)=>Math.round(v)===Math.round(b[i])); };

// แบบสำเร็จตาม layout ปัจจุบัน: ตำแหน่ง/โซนมาจาก layout · สไตล์ชื่อ (ฟอนต์ สี กรอบ) และการ์ตูนในช่องมาจากแบบสำเร็จ
function presetObjs(P){ const base=layoutObjs(), src=unpackObjs(P.objects), sT=src.filter(o=>o.type==="text"&&o.link0!=null), sS=src.filter(o=>o.type==="slot"||(o.type==="image"&&o.slotBox));
  const extra=src.filter(o=>!sT.includes(o)&&!sS.includes(o)); let ti=0, si=0; const KEYS=["text","font","color","stroke","bold","ls","lh","align","frame","opacity"];
  const out=base.map(o=>{ if(o.type==="text"){ const q=sT[ti++]||sT[sT.length-1]; if(q) KEYS.forEach(k=>{ if(q[k]!==undefined) o[k]=JSON.parse(JSON.stringify(q[k])); }); o.w=0; o.h=0; if(o.box) fitBox(o); else measure(o); return o; }
    if(o.type==="slot"){ const q=sS[si++]; if(q&&q.type==="image"){ const k=Math.min(o.w/q.w,o.h/q.h), w=Math.round(q.w*k), h=Math.round(q.h*k); return Object.assign({},q,{id:uid(),x:Math.round(o.x+(o.w-w)/2),y:Math.round(o.y+(o.h-h)/2),w,h,slotBox:{x:o.x,y:o.y,w:o.w,h:o.h}}); } }

function nextCode(t,from){ const ps=presetsOf(t), used=new Set(ps.map(p=>p.code)); const base=from||(ps.length?ps[ps.length-1].code:null), m=base&&base.match(/^(.*?)(\d+)$/);

  for(let n=1;;n++){ const c=t.name+String(n).padStart(3,"0"); if(!used.has(c)) return c; } }

function setDim(ax,v){ const sel=selObjs(); if(sel.length>1){ v=parseFloat(v); if(!(v>0)){ side(); return; } const B=bounds(sel), f=(v/25.4*ED.tpl.res)/B[ax==="w"?"w":"h"], cx=B.x+B.w/2, cy=B.y+B.h/2; cp();

function align(k){ const sel=selObjs(); if(!sel.length) return; cp();
  const R=sel.length===1?safeRect():bounds(sel);
  sel.forEach(o=>{ const b=aabb(o); if(k==="l") o.x+=R.x-b.x; if(k==="r") o.x+=R.x+R.w-b.x-b.w; if(k==="ch") o.x+=R.x+R.w/2-b.x-b.w/2; if(k==="t") o.y+=R.y-b.y; if(k==="b") o.y+=R.y+R.h-b.y-b.h; if(k==="cv") o.y+=R.y+R.h/2-b.y-b.h/2; o.x=Math.round(o.x); o.y=Math.round(o.y); });

// จัดเป็นตาราง: หาแถว/คอลัมน์จากตำแหน่งเดิม · เพิ่ม/ลดช่องให้ครบ แถว×คอลัมน์ · ทุกช่องเท่ากัน เว้นห่าง 2 มม.
// จัดชื่อในตารางใหม่: ใส่ช่องเต็ม → ขนาดอักษรเท่ากัน → แถวชิดขอบบน/ล่างพื้นที่ · คอลัมน์ห่าง ≤2 มม. อยู่กลาง
function regrid(tx){ tx=tx.filter(o=>o.type==="text"&&o.cell&&o.box); if(!tx.length) return; const G=2*ED.tpl.res/25.4;
  tx.forEach(o=>{ o.box=Object.assign({},o.cell); o.w=0; o.h=0; fitBox(o); });
  if(tx.length>1){ let fs=Math.min(...tx.map(o=>o.size)); const fitK=()=>Math.min(...tx.map(o=>{ o.size=fs; o.w=0; o.h=0; measure(o); const B=o.box, E=fext(o), v=Math.abs(Math.abs(o.rot||0)-90)<1, W=o.w+E.l+E.r, H=o.h+E.t+E.b; return v?Math.min(B.h/W,B.w/H):Math.min(B.w/W,B.h/H); }));
    for(let it=0;it<5;it++){ const k=fitK(); if(Math.abs(k-1)<.005) break; fs=Math.max(4,fs*k*.998); }
    tx.forEach(o=>{ o.size=fs; o.w=0; o.h=0; measure(o); centerIn(o,o.box); }); }
  const grp=ax=>{ const m=new Map(); tx.forEach(o=>{ const k=Math.round(o.cell[ax]); if(!m.has(k)) m.set(k,[]); m.get(k).push(o); }); return [...m.entries()].sort((a,b)=>a[0]-b[0]).map(e=>e[1]); };
  const rows=grp("y"), cols=grp("x"), Y0=Math.min(...tx.map(o=>o.cell.y)), Y1=Math.max(...tx.map(o=>o.cell.y+o.cell.h)), X0=Math.min(...tx.map(o=>o.cell.x)), X1=Math.max(...tx.map(o=>o.cell.x+o.cell.w));
  const sp=(g,ax)=>{ const bs=g.map(aabb); return ax==="y"?[Math.min(...bs.map(b=>b.y)),Math.max(...bs.map(b=>b.y+b.h))]:[Math.min(...bs.map(b=>b.x)),Math.max(...bs.map(b=>b.x+b.w))]; };
  const spread=(gs,ax,A0,A1)=>{ const n=gs.length, S=gs.map(g=>sp(g,ax)), tot=S.reduce((t,[a,b])=>t+b-a,0); let gap=n>1?(A1-A0-tot)/(n-1):0; if(ax==="x"&&gap>G) gap=G; let cur=A0+(A1-A0-tot-gap*(n-1))/2;
    gs.forEach((g,i)=>{ const d=cur-S[i][0]; g.forEach(o=>{ o[ax]=Math.round(o[ax]+d); o.box[ax]+=d; }); cur+=S[i][1]-S[i][0]+gap; }); };
  if(tx.some(o=>o.cellFree)||rows.length*cols.length!==tx.length) return;
  if(rows.length>1) spread(rows,"y",Y0,Y1); spread(cols,"x",X0,X1);
  tx.forEach(o=>{ const a=aabb(o), B=o.box, c=a.y+a.h/2, hh=Math.max(a.h/2,Math.min(B.h/2,c-Y0,Y1-c)); B.y=c-hh; B.h=2*hh; B.x=a.x; B.w=a.w; }); }
function gridOf(sel){ const cl=(vals,tol)=>{ const v=[...vals].sort((a,b)=>a-b), g=[]; v.forEach(x=>{ if(!g.length||x-g[g.length-1]>tol) g.push(x); }); return g.length; };
